name: wallet

on:
  push:
    branches: [main, claude/eudi-wallet-v1]
    paths: ['wallet/**', '.github/workflows/wallet.yml']
  pull_request:
    paths: ['wallet/**', '.github/workflows/wallet.yml']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: wallet

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wallet/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --ci

  # Publishes the JS bundle with EAS Update so it can be opened in Expo Go.
  # Needs the EXPO_TOKEN repository secret; skipped when it is not set.
  publish:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check for EXPO_TOKEN
        id: token
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN secret is not set; skipping EAS Update." >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wallet/package-lock.json
      - if: steps.token.outputs.present == 'true'
        run: npm ci
      - name: Publish update
        if: steps.token.outputs.present == 'true'
        run: |
          BRANCH="${GITHUB_REF_NAME//\//-}"
          npx --yes eas-cli@latest update --branch "$BRANCH" \
            --message "${GITHUB_SHA::7}" --platform all --non-interactive --json > update.json
          PROJECT_ID=$(node -p 'require("./app.json").expo.extra.eas.projectId')
          GROUP=$(node -p 'require("./update.json")[0].group')
          OWNER=$(npx --yes eas-cli@latest whoami 2>/dev/null | head -1)
          LINK="exp://u.expo.dev/$PROJECT_ID/group/$GROUP"
          PAGE="https://expo.dev/accounts/$OWNER/projects/si-wallet/updates/$GROUP"
          echo "Expo Go link: $LINK"
          echo "Update page:  $PAGE"
          {
            echo "## SI Wallet in Expo Go"
            echo ""
            echo "1. Install **Expo Go** from the App Store / Play Store and sign in with your Expo account."
            echo "2. Open this link on your phone: $LINK"
            echo "3. Or open the update page and tap Preview: $PAGE"
          } >> "$GITHUB_STEP_SUMMARY"
